# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.2.0
  last_upgraded: 2026-10-19

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

project:
  name: "Claude Captain"
  genre: "Starsector mod (AI captain)"
  version: "1.0.9"           # keep in step with mod_info.json
  stage: Production
  kind: mod                  # reserved in the framework; recorded for when skills read it

engine:
  name: "Starsector"         # not one of the framework's three engines; set by hand
  version: "0.98a-RC8"
  language: "Java"

specialists:                 # the Java track's agents (.claude/java/README.md)
  code: "java-specialist"
  ui: "ui-programmer"
  additional: ["starsector-specialist", "gameplay-programmer"]

testing:
  framework: "java-main"     # plain Java test classes in tests/, run by /java-test
  strict:
    logic: true              # /java-test FAIL or NOT ASSESSED blocks a Logic story
    integration: true
    visual: false            # evidence waits on the player's live check (/java-live-check)
    ui: false                #   advisory here, but a story is not Done until it is recorded
    config: false

platform:
  multiplayer: false
  online: false
  targets: [PC]
  primary_input: "Keyboard/Mouse"
  gamepad_support: "None"
  touch_support: "None"
  cert_tier: none

commands:                    # C = starsector-core folder, OUT = build output folder
  build: "C=<starsector-core> OUT=out bash tools/build.sh"
  test: "C=<starsector-core> OUT=out bash tools/test.sh"

naming:
  classes: PascalCase
  variables: camelCase
  constants: SCREAMING_SNAKE
  files: PascalCase

performance:
  memory_ceiling_mb: 2048
  enforce: warn
